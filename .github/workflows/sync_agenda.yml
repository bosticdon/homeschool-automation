name: Daily ClassReach & Yahoo Agenda Sync

on:
  schedule:
    # Triggers Monday through Friday at 10:00 UTC (6:00 AM EST)
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # Enables manual trigger button on GitHub UI

jobs:
  run-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Execute Daily Scrape & Sync
        env:
          CLASSREACH_USER: ${{ secrets.CLASSREACH_USER }}
          CLASSREACH_PASS: ${{ secrets.CLASSREACH_PASS }}
          YAHOO_EMAIL: ${{ secrets.YAHOO_EMAIL }}
          YAHOO_APP_PASS: ${{ secrets.YAHOO_APP_PASS }}
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: python auto_sync.py
